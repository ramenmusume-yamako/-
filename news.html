<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>かわら版（お知らせ） | ラーメン娘</title>
    <link rel="stylesheet" href="news.css">
    
    <!-- Cropper.js (画像トリミング用ライブラリ) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    
    <style>
        /* トリミングモーダル用スタイル */
        .crop-container {
            max-width: 100%;
            max-height: 400px;
            margin-bottom: 15px;
            background-color: #333;
        }
        .crop-container img {
            max-width: 100%;
            display: block;
        }
        .crop-btn-group {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }
        .crop-btn {
            padding: 8px 16px;
            border: 2px solid #2b2b2b;
            font-weight: bold;
            cursor: pointer;
        }
        .crop-btn-submit {
            background-color: #800000;
            color: #fff;
        }
        .crop-btn-cancel {
            background-color: #ccc;
        }
        /* トリミング完了後のプレビュー表示 */
        .cropped-preview {
            margin-top: 10px;
            max-width: 100%;
            height: 100px;
            object-fit: cover;
            border: 2px dashed #800000;
            display: none;
        }
    </style>
</head>
<body class="news-page-theme">

    <header class="hamburger-menu">
        <input type="checkbox" id="menu-btn-check">
        <label for="menu-btn-check" class="menu-btn"><span></span></label>
        <div class="menu-content">
            <ul>
                <li><a href="index.html">ホーム</a></li>
                <li><a href="character.html">キャラ紹介</a></li>
                <li><a href="game.html">ミニゲーム</a></li>
                <li><a href="news.html">お知らせ</a></li>
                <li id="debug-menu-item" style="display: none;">
                    <a href="debug.html" class="debug-link">🔧 デバッグページ</a>
                </li>
            </ul>
        </div>
    </header>

    <div class="deco-text">瓦版</div>

    <main class="news-container">
        <div class="news-card-box">
            <div class="news-header">
                <span class="sub-title">―― 最新情報 ――</span>
                <h1 class="page-title">かわら版（お知らせ）</h1>
            </div>

            <!-- 動的にお知らせが入るリスト容器 -->
            <ul class="news-list" id="news-list"></ul>

            <div class="hanko">通</div>
        </div>
    </main>

    <!-- デバッグ用：右下の(+)ボタン -->
    <button id="add-news-fab" class="add-news-fab" style="display: none;">＋</button>

    <!-- 1. お知らせ詳細表示用ポップアップ（大きく表示） -->
    <div id="detail-modal" class="news-modal" style="display: none;">
        <div class="modal-content detail-modal-content">
            <div class="modal-header">
                <div class="detail-meta-header">
                    <span id="detail-date" class="news-date"></span>
                    <span id="detail-category" class="news-label"></span>
                </div>
                <button id="close-detail-btn" class="close-btn">&times;</button>
            </div>
            
            <h2 id="detail-title" class="detail-modal-title"></h2>
            
            <!-- タイトル画像 -->
            <div id="detail-title-img-container"></div>
            
            <!-- 本文エリア -->
            <div id="detail-text" class="news-item-text detail-body-text"></div>
            
            <!-- 詳細画像ギャラリー -->
            <div id="detail-gallery" class="news-detail-gallery"></div>
        </div>
    </div>

    <!-- 2. お知らせ投稿用モーダルダイアログ (デバッグモードのみ使用) -->
    <div id="news-modal" class="news-modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2>瓦版 新規投稿</h2>
                <button id="close-modal-btn" class="close-btn">&times;</button>
            </div>
            <form id="news-form">
                <div class="form-group">
                    <label>カテゴリ</label>
                    <select id="news-category" required>
                        <option value="label-menu">新メニュー</option>
                        <option value="label-update">更新情報</option>
                        <option value="label-event">お祭り</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>タイトル</label>
                    <input type="text" id="news-title" placeholder="タイトルを入力" required>
                </div>

                <div class="form-group">
                    <label>アイキャッチ画像 (ヘッダー用に範囲指定)</label>
                    <input type="file" id="news-title-img" accept="image/*">
                    <!-- 切り抜いた結果の切り抜きプレビュー表示 -->
                    <img id="title-cropped-preview" class="cropped-preview" alt="調整済み画像">
                </div>

                <div class="form-group">
                    <label>詳細本文 (URLは自動でリンク化されます)</label>
                    <textarea id="news-detail-text" rows="5" placeholder="詳細を入力してください"></textarea>
                </div>

                <div class="form-group">
                    <label>詳細用追加画像 (複数可)</label>
                    <input type="file" id="news-detail-imgs" accept="image/*" multiple>
                </div>

                <button type="submit" class="submit-btn">投稿する</button>
            </form>
        </div>
    </div>

    <!-- 3. 画像位置・拡大調整（トリミング）専用モーダル -->
    <div id="crop-modal" class="news-modal" style="display: none; z-index: 300;">
        <div class="modal-content">
            <div class="modal-header">
                <h2>画像の範囲調整</h2>
            </div>
            <p style="font-size: 0.85rem; color: #666; margin: 5px 0 10px;">
                枠をドラッグ・拡大縮小してヘッダーに合わせる位置を決めてください。
            </p>
            <div class="crop-container">
                <img id="crop-image" src="" alt="調整用画像">
            </div>
            <div class="crop-btn-group">
                <button type="button" id="crop-cancel-btn" class="crop-btn crop-btn-cancel">キャンセル</button>
                <button type="button" id="crop-submit-btn" class="crop-btn crop-btn-submit">決定</button>
            </div>
        </div>
    </div>

    <footer class="shop-footer">
        <p>&copy; 2026 ramengirls</p>
    </footer>

    <script>
      (function trackPV() {
        const today = new Date().toISOString().split('T')[0];
        let pvData = JSON.parse(localStorage.getItem('site_pv_data') || '{}');
        pvData[today] = (pvData[today] || 0) + 1;
        localStorage.setItem('site_pv_data', JSON.stringify(pvData));
      })();
    </script>

    <script>
      const defaultNews = [
        {
          id: '1',
          date: '2026.05.25',
          category: 'label-menu',
          categoryName: '新メニュー',
          title: '夏季限定「冷やし極太冷麺」がまもなく登場！',
          titleImg: '',
          text: 'メーナちゃんも大絶賛！\nキンキンに冷えた醤油スープに、自慢の極太ちぢれ麺が絡む至高の一杯です。\n\n6月1日より提供開始いたします！',
          detailImgs: []
        }
      ];

      const categoryLabels = {
        'label-menu': '新メニュー',
        'label-update': '更新情報',
        'label-event': 'お祭り'
      };

      let isDebug = false;
      let cropper = null; // Cropperインスタンス
      let croppedBase64Result = ''; // 切り抜いた画像データ

      function fileToBase64(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.onerror = error => reject(error);
          reader.readAsDataURL(file);
        });
      }

      function linkify(text) {
        if (!text) return '';
        const urlRegex = /(https?:\/\/[^\s]+)/g;
        return text.replace(urlRegex, url => `<a href="${url}" target="_blank" rel="noopener noreferrer">${url}</a>`);
      }

      function renderNews() {
        const newsListEl = document.getElementById('news-list');
        const newsData = JSON.parse(localStorage.getItem('site_news_data') || JSON.stringify(defaultNews));
        
        if (newsData.length === 0) {
          newsListEl.innerHTML = '<li class="news-empty">現在お知らせはありません。</li>';
          return;
        }

        newsListEl.innerHTML = newsData.map(item => `
          <li class="news-item" id="news-${item.id}">
            <div class="news-meta">
              <span class="news-date">${item.date}</span>
              <span class="news-label ${item.category}">${item.categoryName || categoryLabels[item.category]}</span>
            </div>
            
            <div class="news-content">
              <div class="news-title-area" onclick="openDetail('${item.id}')">
                <h3 class="news-item-title">${item.title}</h3>
                ${item.titleImg ? `<div class="news-title-img-wrap"><img src="${item.titleImg}" alt="タイトル画像" class="news-title-img"></div>` : ''}
                <span class="toggle-icon">クリックで詳細を表示 🔍</span>
              </div>
            </div>

            ${isDebug ? `<button class="delete-news-btn" onclick="deleteNews('${item.id}')">削除</button>` : ''}
          </li>
        `).join('');
      }

      function openDetail(id) {
        const newsData = JSON.parse(localStorage.getItem('site_news_data') || JSON.stringify(defaultNews));
        const item = newsData.find(n => n.id === id);
        if (!item) return;

        document.getElementById('detail-date').textContent = item.date;
        
        const catEl = document.getElementById('detail-category');
        catEl.textContent = item.categoryName || categoryLabels[item.category];
        catEl.className = `news-label ${item.category}`;

        document.getElementById('detail-title').textContent = item.title;

        const titleImgContainer = document.getElementById('detail-title-img-container');
        if (item.titleImg) {
          titleImgContainer.innerHTML = `<img src="${item.titleImg}" class="detail-hero-img" alt="タイトル画像">`;
        } else {
          titleImgContainer.innerHTML = '';
        }

        document.getElementById('detail-text').innerHTML = linkify(item.text);

        const galleryEl = document.getElementById('detail-gallery');
        if (item.detailImgs && item.detailImgs.length > 0) {
          galleryEl.innerHTML = item.detailImgs.map(img => `<img src="${img}" class="news-detail-img" alt="詳細画像">`).join('');
        } else {
          galleryEl.innerHTML = '';
        }

        document.getElementById('detail-modal').style.display = 'flex';
      }

      function deleteNews(id) {
        if (!confirm('このお知らせを削除してもよろしいですか？')) return;
        let newsData = JSON.parse(localStorage.getItem('site_news_data') || JSON.stringify(defaultNews));
        newsData = newsData.filter(item => item.id !== id);
        localStorage.setItem('site_news_data', JSON.stringify(newsData));
        renderNews();
      }

      document.addEventListener('DOMContentLoaded', () => {
        isDebug = localStorage.getItem('debug_mode') === 'true';

        const debugMenuItem = document.getElementById('debug-menu-item');
        if (debugMenuItem && isDebug) debugMenuItem.style.display = 'block';

        const fabBtn = document.getElementById('add-news-fab');
        const modal = document.getElementById('news-modal');
        const closeModalBtn = document.getElementById('close-modal-btn');
        const newsForm = document.getElementById('news-form');

        // ★ デバッグモードの時のみ、投稿ボタンや各種イベントを有効化 ★
        if (isDebug) {
          if (fabBtn) fabBtn.style.display = 'flex';

          if (fabBtn) fabBtn.addEventListener('click', () => modal.style.display = 'flex');
          if (closeModalBtn) closeModalBtn.addEventListener('click', () => modal.style.display = 'none');

          // 画像トリミング用の要素
          const titleImgInput = document.getElementById('news-title-img');
          const cropModal = document.getElementById('crop-modal');
          const cropImage = document.getElementById('crop-image');
          const cropSubmitBtn = document.getElementById('crop-submit-btn');
          const cropCancelBtn = document.getElementById('crop-cancel-btn');
          const titleCroppedPreview = document.getElementById('title-cropped-preview');

          // デバッグ時の投稿モーダル内で画像を選んだ場合のみトリミングを開く
          if (titleImgInput) {
            titleImgInput.addEventListener('change', (e) => {
              const file = e.target.files[0];
              if (!file) return;

              const reader = new FileReader();
              reader.onload = (event) => {
                cropImage.src = event.target.result;
                cropModal.style.display = 'flex';

                if (cropper) cropper.destroy();

                cropper = new Cropper(cropImage, {
                  aspectRatio: 3.5 / 1, // ヘッダー用の横長比率
                  viewMode: 1,
                  autoCropArea: 1
                });
              };
              reader.readAsDataURL(file);
            });
          }

          if (cropSubmitBtn) {
            cropSubmitBtn.addEventListener('click', () => {
              if (!cropper) return;
              const canvas = cropper.getCroppedCanvas({
                width: 800,
                height: 230
              });
              croppedBase64Result = canvas.toDataURL('image/jpeg');

              titleCroppedPreview.src = croppedBase64Result;
              titleCroppedPreview.style.display = 'block';
              cropModal.style.display = 'none';
            });
          }

          if (cropCancelBtn) {
            cropCancelBtn.addEventListener('click', () => {
              titleImgInput.value = '';
              croppedBase64Result = '';
              titleCroppedPreview.style.display = 'none';
              cropModal.style.display = 'none';
            });
          }

          if (newsForm) {
            newsForm.addEventListener('submit', async (e) => {
              e.preventDefault();

              const category = document.getElementById('news-category').value;
              const title = document.getElementById('news-title').value;
              const text = document.getElementById('news-detail-text').value;

              const detailImgFiles = Array.from(document.getElementById('news-detail-imgs').files);
              const detailImgsBase64 = [];
              for (const file of detailImgFiles) {
                const b64 = await fileToBase64(file);
                detailImgsBase64.push(b64);
              }

              const now = new Date();
              const dateStr = `${now.getFullYear()}.${String(now.getMonth() + 1).padStart(2, '0')}.${String(now.getDate()).padStart(2, '0')}`;

              const newNewsItem = {
                id: Date.now().toString(),
                date: dateStr,
                category: category,
                categoryName: categoryLabels[category],
                title: title,
                titleImg: croppedBase64Result,
                text: text,
                detailImgs: detailImgsBase64
              };

              const newsData = JSON.parse(localStorage.getItem('site_news_data') || JSON.stringify(defaultNews));
              newsData.unshift(newNewsItem);
              localStorage.setItem('site_news_data', JSON.stringify(newsData));

              newsForm.reset();
              croppedBase64Result = '';
              titleCroppedPreview.style.display = 'none';
              modal.style.display = 'none';
              renderNews();
              alert('お知らせを投稿しました！');
            });
          }
        }

        if (!localStorage.getItem('site_news_data')) {
          localStorage.setItem('site_news_data', JSON.stringify(defaultNews));
        }

        renderNews();

        document.getElementById('close-detail-btn').addEventListener('click', () => {
          document.getElementById('detail-modal').style.display = 'none';
        });
      });
    </script>
</body>
</html>

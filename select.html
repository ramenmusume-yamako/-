<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>キャラクター選択</title>
    <style>
        /* 全体の背景：写真と同じ温かみのあるクリーム色 */
        body {
            margin: 0; padding: 0; 
            background: #f7f4e9; 
            color: #333333; 
            font-family: sans-serif; display: flex; align-items: center; justify-content: center;
            width: 100vw; height: 100dvh; overflow: hidden;
            perspective: 1000px;
        }

        /* メインコンテナ：画面から絶対にはみ出さない設定 */
        .game-selection-container {
            display: flex; flex-direction: column;
            width: 95vw; height: 90dvh; max-width: 1100px; max-height: 620px;
            background: #ffffff; 
            border: 3px solid #000000; 
            border-radius: 16px; padding: 20px; box-sizing: border-box;
            box-shadow: 8px 8px 0px #9c1c11; 
            gap: 10px;
            position: relative;
            transition: transform 0.2s ease;
        }

        /* ヘッダーの文字色：深みのある中華赤 */
        h2 { 
            font-size: 22px; margin: 0; text-align: center; 
            color: #9c1c11; 
            font-weight: bold;
            letter-spacing: 2px;
        }

        /* 湾曲した格子を再現するコンテナ */
        .grid-panel {
            flex: 1; width: 100%; height: calc(100% - 40px);
            display: flex; align-items: center; justify-content: center;
            box-sizing: border-box;
        }

        /* 横5列 × 縦2行（計10マス）の格子状配置 */
        .char-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr); 
            grid-template-rows: repeat(2, 1fr);    
            gap: 12px; width: 100%; height: 100%;
            box-sizing: border-box;
            transform: rotateY(-6px) rotateX(4px); 
        }

        /* 1つ1つのマス */
        .char-card {
            background: #ffffff; 
            border: 2px solid #cdcdcd; 
            border-radius: 8px; display: flex; flex-direction: column;
            align-items: center; justify-content: space-between; position: relative;
            transition: all 0.2s ease; padding: 8px; box-sizing: border-box;
            box-shadow: 4px 4px 0px rgba(0, 0, 0, 0.03);
            width: 100%; height: 100%;
            overflow: hidden;
        }

        /* キャラクター画像 */
        .char-card img { 
            width: 100%; 
            height: 65%; 
            object-fit: contain; 
            background: #fafafa;
            border: 1px solid #eeeeee;
            border-radius: 4px;
            box-sizing: border-box;
        }
        
        /* キャラクター名 */
        .char-card .char-name { 
            margin: 4px 0 0; font-size: 13px; font-weight: bold; 
            color: #333333; 
            text-align: center;
            width: 100%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* 【選択中】緑の太枠 */
        .char-card.selected {
            border: 3px solid #2ecc71 !important;
            box-shadow: 4px 4px 0px #2ecc71 !important;
            background: rgba(46, 204, 113, 0.03) !important;
        }

        /* ホバー反応 */
        .char-card.unlocked {
            cursor: pointer;
        }
        .char-card.unlocked:hover:not(.selected) {
            border-color: #9c1c11; 
            box-shadow: 4px 4px 0px rgba(156, 28, 17, 0.2);
        }

        /* 未解放（「？」マス） */
        .char-card.locked { 
            cursor: default; 
            background: #f7f7f7; 
            opacity: 0.7; 
        }
        .char-card.locked img {
            filter: grayscale(100%);
            opacity: 0.5;
        }
        .char-card.locked .char-name {
            color: #999999;
        }

        /* 右下の選択完了ボタンエリア */
        .confirm-btn-container {
            width: 100%; height: 100%; 
            display: flex; align-items: center; justify-content: center;
            box-sizing: border-box;
        }
        
        /* 選択完了ボタン */
        .confirm-btn {
            width: 100%; height: 100%; 
            background: #9c1c11; 
            border: 2px solid #000000; border-radius: 8px; color: white; font-size: 18px;
            font-weight: bold; cursor: pointer; transition: 0.2s;
            box-shadow: 4px 4px 0px #f7c11e; 
            letter-spacing: 2px;
            box-sizing: border-box;
        }
        .confirm-btn:hover { transform: translate(2px, 2px); box-shadow: 2px 2px 0px #f7c11e; }
        .confirm-btn:active { transform: scale(0.98); }

        /* スマホ（縦長画面）用のレスポンシブ最適化（回転なし・正位置） */
        @media (max-width: 768px) and (orientation: portrait) {
            .game-selection-container {
                width: 95vw;   
                height: auto;  
                aspect-ratio: 5 / 3.5; 
                max-width: 100%;
                max-height: 80dvh;
                padding: 12px;
                transform: none; 
                box-shadow: 5px 5px 0px #9c1c11;
                gap: 8px;
            }
            h2 { font-size: 15px; letter-spacing: 1px; }
            .grid-panel { height: auto; }
            .char-grid { gap: 6px; transform: rotateY(-3px) rotateX(2px); }
            .char-card { padding: 4px; border-width: 1.5px; border-radius: 6px; }
            .char-card img { height: 60%; }
            .char-card .char-name { font-size: 9px; margin-top: 2px; }
            .confirm-btn { font-size: 11px; letter-spacing: 0px; border-width: 1.5px; border-radius: 6px; box-shadow: 2px 2px 0px #f7c11e; }
            .char-card.selected { border-width: 2px !important; box-shadow: 2px 2px 0px #2ecc71 !important; }
        }

        /* 横向きのスマホへの配慮 */
        @media (max-width: 920px) and (orientation: landscape) {
            .game-selection-container { height: 95vh; padding: 10px; }
            h2 { font-size: 16px; }
            .char-grid { gap: 6px; }
            .char-card { padding: 4px; }
            .char-card img { height: 60%; }
            .char-card .char-name { font-size: 10px; }
            .confirm-btn { font-size: 14px; }
        }
    </style>
</head>
<body>

    <div class="game-selection-container">
        <h2 id="selectTitle">キャラクターを選択してください</h2>
        
        <div class="grid-panel">
            <div class="char-grid" id="gridContainer"></div>
        </div>
    </div>

    <script>
        // 全体のキャラクターデータ
        const CHAR_DATA = {
            hajime: { name: "ハジメ",     imgL: "hajimel.png" }, 
            meana:  { name: "メーナ",     imgL: "meanal.png" },  
            boy:    { name: "中華ボーイ",   imgL: "boy_l.png" },  
            aniki:  { name: "チャーシュー兄", imgL: "aniki_l.png" }, 
            naruto: { name: "ナルトちゃん", imgL: "naruto_l.png" }  
        };

        const CHAR_KEYS = Object.keys(CHAR_DATA);

        let tempSelectedChar = localStorage.getItem("selectedChar") || "hajime";
        
        let unlocked = [];
        try {
            const saved = localStorage.getItem("unlockedChars");
            // 💡【強力ガード】もしデータが空、または配列じゃなかったら強制的に初期化する
            if (saved && saved !== "undefined" && saved !== "null") {
                unlocked = JSON.parse(saved);
            }
            if (!Array.isArray(unlocked)) {
                unlocked = [];
            }
        } catch(e) {
            unlocked = [];
        }

        // ハジメを確実に解放リストに入れる
        if (!unlocked.includes("hajime")) { 
            unlocked.push("hajime"); 
            localStorage.setItem("unlockedChars", JSON.stringify(unlocked));
        }

        if (!CHAR_DATA[tempSelectedChar]) {
            tempSelectedChar = "hajime";
        }

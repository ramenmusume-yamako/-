<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>キャラクター選択</title>
    <style>
        /* 全体の背景：写真と同じ温かみのあるクリーム色 */
        body {
            margin: 0; padding: 0; 
            background: #f7f4e9; 
            color: #333333; 
            font-family: sans-serif; display: flex; align-items: center; justify-content: center;
            width: 100vw; height: 100dvh; overflow: hidden;
            perspective: 1000px;
        }

        /* メインコンテナ：画面から絶対にはみ出さないよう box-sizing を徹底 */
        .game-selection-container {
            display: flex; flex-direction: column;
            width: 95vw; height: 90dvh; max-width: 1100px; max-height: 620px;
            background: #ffffff; 
            border: 3px solid #000000; 
            border-radius: 16px; padding: 20px; box-sizing: border-box;
            box-shadow: 8px 8px 0px #9c1c11; 
            gap: 10px;
            position: relative;
        }

        /* ヘッダーの文字色：深みのある中華赤 */
        h2 { 
            font-size: 22px; margin: 0; text-align: center; 
            color: #9c1c11; 
            font-weight: bold;
            letter-spacing: 2px;
        }

        /* 湾曲した格子を再現するコンテナ */
        .grid-panel {
            flex: 1; width: 100%; height: calc(100% - 40px);
            display: flex; align-items: center; justify-content: center;
            box-sizing: border-box;
        }

        /* 横4列×縦3行の格子状配置（大暴走を防ぐため、はみ出しをカットする設定を追加） */
        .char-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr); 
            grid-template-rows: repeat(3, 1fr);    
            gap: 12px; width: 100%; height: 100%;
            box-sizing: border-box;
            transform: rotateY(-6px) rotateX(4px); /* 緩やかな湾曲・傾き構造を100%維持 */
        }

        /* 1つ1つのマス（画像が下にはみ出さないようレイアウトを最適化） */
        .char-card {
            background: #ffffff; 
            border: 2px solid #cdcdcd; 
            border-radius: 8px; display: flex; flex-direction: column;
            align-items: center; justify-content: space-between; position: relative;
            transition: all 0.2s ease; padding: 8px; box-sizing: border-box;
            box-shadow: 4px 4px 0px rgba(0, 0, 0, 0.03);
            width: 100%; height: 100%;
            overflow: hidden; /* マス目の中身が外に飛び出すのを防ぐ安全装置 */
        }

        /* キャラクター画像（縦幅を65%に抑えて、名前スペースを安全に確保） */
        .char-card img { 
            width: 100%; 
            height: 65%; 
            object-fit: contain; 
            background: #fafafa;
            border: 1px solid #eeeeee;
            border-radius: 4px;
            box-sizing: border-box;
        }
        
        /* キャラクター名 */
        .char-card .char-name { 
            margin: 4px 0 0; font-size: 13px; font-weight: bold; 
            color: #333333; 
            text-align: center;
            width: 100%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* ★【選択中】緑の太枠（立体感を邪魔しないシャドウに調整） */
        .char-card.selected {
            border: 3px solid #2ecc71 !important;
            box-shadow: 4px 4px 0px #2ecc71 !important;
            background: rgba(46, 204, 113, 0.03) !important;
        }

        /* PCでマウスカーソルを合わせた時のホバー反応 */
        .char-card.unlocked {
            cursor: pointer;
        }
        .char-card.unlocked:hover:not(.selected) {
            border-color: #9c1c11; 
            box-shadow: 4px 4px 0px rgba(156, 28, 17, 0.2);
        }

        /* 未解放（「？」マス）のスタイル */
        .char-card.locked { 
            cursor: default; 
            background: #f7f7f7; 
            opacity: 0.7; 
        }
        .char-card.locked img {
            filter: grayscale(100%);
            opacity: 0.5;
        }
        .char-card.locked .char-name {
            color: #999999;
        }

        /* 右下に配置する選択完了ボタンのエリア */
        .confirm-btn-container {
            width: 100%; height: 100%; 
            display: flex; align-items: center; justify-content: center;
            box-sizing: border-box;
        }
        
        /* 選択完了ボタン：赤×金色のカチッとした影 */
        .confirm-btn {
            width: 100%; height: 100%; 
            background: #9c1c11; 
            border: 2px solid #000000; border-radius: 8px; color: white; font-size: 16px;
            font-weight: bold; cursor: pointer; transition: 0.2s;
            box-shadow: 4px 4px 0px #f7c11e; 
            letter-spacing: 2px;
            box-sizing: border-box;
        }
        .confirm-btn:hover { transform: translate(2px, 2px); box-shadow: 2px 2px 0px #f7c11e; }
        .confirm-btn:active { transform: scale(0.98); }
    </style>
</head>
<body>

    <div class="game-selection-container">
        <h2 id="selectTitle">キャラクターを選択してください</h2>
        
        <div class="grid-panel">
            <div class="char-grid" id="gridContainer"></div>
        </div>
    </div>

    <script>
        // 全体のキャラクターデータ（5人）
        const CHAR_DATA = {
            hajime: { name: "ハジメ",     imgL: "hajimel.png" }, 
            meana:  { name: "メーナ",     imgL: "meanal.png" },  
            boy:    { name: "中華ボーイ",   imgL: "boy_l.png" },  
            aniki:  { name: "チャーシュー兄", imgL: "aniki_l.png" }, 
            naruto: { name: "ナルトちゃん", imgL: "naruto_l.png" }  
        };

        const CHAR_KEYS = Object.keys(CHAR_DATA);

        let tempSelectedChar = localStorage.getItem("selectedChar") || "hajime";
        
        let unlocked = [];
        try {
            unlocked = JSON.parse(localStorage.getItem("unlockedChars")) || [];
        } catch(e) {
            unlocked = [];
        }

        if (!unlocked.includes("hajime")) { 
            unlocked.push("hajime"); 
            localStorage.setItem("unlockedChars", JSON.stringify(unlocked));
        }

        if (!CHAR_DATA[tempSelectedChar]) {
            tempSelectedChar = "hajime";
        }

        // グリッド画面を生成（1マス目〜12マス目までを完全にループ埋め）
        function renderGrid() {
            const container = document.getElementById("gridContainer");
            container.innerHTML = ""; 

            // 3行×4列＝全12マスの配置を上から順にループ処理
            for (let i = 0; i < 12; i++) {
                const row = Math.floor(i / 4) + 1;
                const col = (i % 4) + 1;

                // 12マス目（最後の右下）なら「選択完了ボタン」を入れる
                if (row === 3 && col === 4) {
                    const btnContainer = document.createElement('div');
                    btnContainer.className = "confirm-btn-container";
                    btnContainer.style.gridColumn = col;
                    btnContainer.style.gridRow = row;
                    btnContainer.innerHTML = `<button class="confirm-btn" onclick="saveSelection()">選択完了</button>`;
                    container.appendChild(btnContainer);
                    continue;
                }

                // 1〜11マス目の処理
                const card = document.createElement('div');
                card.style.gridColumn = col;
                card.style.gridRow = row;

                if (i < CHAR_KEYS.length) {
                    // データがあるキャラ（1〜5マス目）
                    const id = CHAR_KEYS[i];
                    const char = CHAR_DATA[id];
                    const isUnlocked = unlocked.includes(id);

                    card.className = `char-card ${isUnlocked ? 'unlocked' : 'locked'} ${tempSelectedChar === id ? 'selected' : ''}`;
                    card.dataset.id = id;

                    if (isUnlocked) {
                        card.innerHTML = `
                            <img src="${char.imgL}" alt="${char.name}">
                            <div class="char-name">${char.name}</div>
                        `;
                        card.addEventListener('click', () => {
                            selectCharacter(id);
                        });
                    } else {
                        card.innerHTML = `
                            <img src="question.png" alt="未解放">
                            <div class="char-name">????</div>
                        `;
                    }
                } else {
                    // データがない空きマス（6〜11マス目）には自動で「未解放ハテナ」を敷き詰める！
                    card.className = `char-card locked`;
                    card.innerHTML = `
                        <img src="question.png" alt="未解放">
                        <div class="char-name">????</div>
                    `;
                }

                container.appendChild(card);
            }
        }

        // キャラクターを選択した時に緑枠を切り替える共通関数
        function selectCharacter(id) {
            if (!unlocked.includes(id)) return;
            tempSelectedChar = id;
            document.querySelectorAll('.char-card').forEach(c => c.classList.remove('selected'));
            const selectedCard = document.querySelector(`.char-card[data-id="${id}"]`);
            if (selectedCard) {
                selectedCard.classList.add('selected');
            }
        }

        // PC専用：矢印キー
        document.addEventListener('keydown', (event) => {
            const unlockedList = CHAR_KEYS.filter(id => unlocked.includes(id));
            let currentIndex = unlockedList.indexOf(tempSelectedChar);

            if (event.key === 'ArrowRight' || event.key === 'ArrowDown') {
                currentIndex = (currentIndex + 1) % unlockedList.length;
                selectCharacter(unlockedList[currentIndex]);
                event.preventDefault(); 
            } else if (event.key === 'ArrowLeft' || event.key === 'ArrowUp') {
                currentIndex = (currentIndex - 1 + unlockedList.length) % unlockedList.length;
                selectCharacter(unlockedList[currentIndex]);
                event.preventDefault();
            }
        });

        // 選択完了処理
        function saveSelection() {
            localStorage.setItem("selectedChar", tempSelectedChar);
            window.location.href = "game.html";
        }

        renderGrid();
    </script>
</body>
</html>

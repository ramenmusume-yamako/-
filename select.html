<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>キャラクター選択</title>
    <style>
        body {
            margin: 0; padding: 0; background: #111a24; color: white;
            font-family: sans-serif; display: flex; align-items: center; justify-content: center;
            width: 100vw; height: 100dvh; overflow: hidden;
            perspective: 1000px;
        }

        .game-selection-container {
            display: flex; flex-direction: column;
            width: 95vw; height: 90dvh; max-width: 1100px; max-height: 620px;
            background: rgba(20, 30, 45, 0.85); border: 2px solid #34495e;
            border-radius: 16px; padding: 25px; box-sizing: border-box;
            box-shadow: 0 0 40px rgba(0,0,0,0.8); gap: 15px;
        }

        h2 { font-size: 24px; margin: 0; text-align: center; color: #f1c40f; }

        /* 手描きの湾曲した格子を再現するコンテナ */
        .grid-panel {
            flex: 1; width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
        }

        /* 横4列×縦3行の格子状配置 */
        .char-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr); /* 横に4人表示 */
            grid-template-rows: repeat(3, 1fr);    /* 縦に3行表示 */
            gap: 15px; width: 100%; height: 100%;
            transform: rotateY(-6px) rotateX(4px); /* 緩やかな湾曲・傾き感 */
        }

        /* 1つ1つのマス */
        .char-cell {
            background: rgba(0,0,0,0.4); border: 2px solid #2c3e50;
            border-radius: 8px; display: flex; flex-direction: column;
            align-items: center; justify-content: center; position: relative;
            cursor: pointer; transition: all 0.2s ease; padding: 5px; box-sizing: border-box;
        }
        /* 選択中の緑枠エフェクト */
        .char-cell.selected {
            border-color: #2ecc71;
            box-shadow: inset 0 0 15px rgba(46, 204, 113, 0.4), 0 0 15px rgba(46, 204, 113, 0.4);
            background: rgba(46, 204, 113, 0.05);
        }
        .char-cell img { width: 85px; height: 85px; object-fit: contain; }
        .char-cell p { margin: 6px 0 0; font-size: 12px; font-weight: bold; color: #bdc3c7; }

        /* 未解放（「？」マス）のスタイル */
        .char-cell.locked { cursor: not-allowed; opacity: 0.6; }
        .char-cell.locked:hover { background: rgba(231, 76, 60, 0.05); border-color: #e74c3c; }

        /* 右下に配置する選択完了ボタンのエリア */
        .confirm-btn-container {
            grid-column: 4; grid-row: 3; /* 4列目の3行目（右下）に強制配置 */
            display: flex; align-items: center; justify-content: center;
        }
        .confirm-btn {
            width: 100%; height: 100%; background: #e67e22;
            border: none; border-radius: 8px; color: white; font-size: 18px;
            font-weight: bold; cursor: pointer; transition: 0.2s;
            box-shadow: 0 4px 10px rgba(230, 126, 34, 0.3);
        }
        .confirm-btn:hover { background: #d35400; transform: scale(1.02); }
        .confirm-btn:active { transform: scale(0.98); }

        /* 未解放マスク（ハテナ画像）のサイズをマス目に合わせる設定 */
.char-card img {
    width: 100%;
    height: 80%; /* 名前の表示スペースを残すために少し縦を縮める */
    object-fit: contain; /* 画像の比率を崩さずにマス目に収める */
}

/* もしハテナ画像専用のクラス名を使う場合 */
.locked-img {
    width: 100%;
    height: 80%;
    object-fit: contain;
}
    </style>
</head>
<body>

    <div class="game-selection-container">
        <h2 id="selectTitle">キャラクターを選択してください</h2>
        
        <div class="grid-panel">
            <div class="char-grid" id="gridContainer">
                </div>
        </div>
    </div>

   <script>
        // ★全てのキャラクターのマスターデータ
        //（ファイル名はすべて同じ階層にある想定のため、フォルダ名は書いていません）
        const CHAR_DATA = {
            hajime: { name: "ハジメ",     imgL: "meanal.png" }, // 初期キャラ
            meana:  { name: "メーナ",     imgL: "meana.png" },  // A店限定キャラ
            boy:    { name: "中華ボーイ",   imgL: "boy_l.png" },  // B店限定キャラ
            aniki:  { name: "チャーシュー兄", imgL: "aniki_l.png" }, // C店限定キャラ
            naruto: { name: "ナルトちゃん", imgL: "naruto_l.png" }  // D店限定キャラ
        };

        // 1. ローカルストレージからデータを読み込む
        // 現在選択中のキャラ（デフォルトは hajime）
        let tempSelectedChar = localStorage.getItem("selectedChar") || "hajime";
        
        // 解放済みのキャラリスト（デフォルトは初期キャラの hajime だけ）
        const unlocked = JSON.parse(localStorage.getItem("unlockedChars")) || ["hajime"];

        // バグ防止：もし選択中キャラがマスターデータにないIDだったらhajimeに戻す
        if (!CHAR_DATA[tempSelectedChar]) {
            tempSelectedChar = "hajime";
        }

        // 2. 12マスのグリッド画面を生成する関数
        function renderGrid() {
            const container = document.getElementById("gridContainer");
            container.innerHTML = ""; // 一度中身を空にする

            // 各キャラの配置されるマス目の位置を完全に固定する配列（3行×4列のインデックス対応）
            // これにより、未解放キャラや翻訳機能で位置が絶対にズレなくなります
            const positions = [
                { col: 1, row: 1 }, // hajime (1人目)
                { col: 2, row: 1 }, // meana  (2人目)
                { col: 3, row: 1 }, // boy    (3人目)
                { col: 4, row: 1 }, // aniki  (4人目)
                { col: 1, row: 2 }  // naruto (5人目)
            ];

            // キャラクターデータをループしてマス目を作っていく
            Object.keys(CHAR_DATA).forEach((id, index) => {
                const char = CHAR_DATA[id];
                const isUnlocked = unlocked.includes(id); // 解放されているか判定
                const pos = positions[index] || { col: (index % 4) + 1, row: Math.floor(index / 4) + 1 };

                const card = document.createElement('div');
                // 解放状態、選択状態に合わせてクラスを付与
                card.className = `char-card ${isUnlocked ? 'unlocked' : 'locked'} ${tempSelectedChar === id ? 'selected' : ''}`;
                
                // イラスト通りの位置にガチッと固定
                card.style.gridColumn = pos.col;
                card.style.gridRow = pos.row;

                // マス目の中身のHTMLを組み立てる
                if (isUnlocked) {
                    // 【解放済みの場合】名前とキャラ画像を表示
                    card.innerHTML = `
                        <img src="${char.imgL}" alt="${char.name}">
                        <div class="char-name">${char.name}</div>
                    `;
                    // クリックしたら選択できるようにする
                    card.addEventListener('click', () => {
                        document.querySelectorAll('.char-card').forEach(c => c.classList.remove('selected'));
                        card.classList.add('selected');
                        tempSelectedChar = id; // 一時的に選択
                    });
                } else {
                    // 【未解放の場合】???? と「puestion.png（ハテナ画像）」を表示
                    card.innerHTML = `
                        <img src="question.png" alt="未解放" class="locked-img">
                        <div class="char-name">????</div>
                    `;
                }

                container.appendChild(card);
            });

            // 3. 右下の12マス目に「選択完了ボタン」を強制配置する
            const btnContainer = document.createElement('div');
            btnContainer.className = "confirm-btn-container";
            btnContainer.style.gridColumn = "4"; // 4列目
            btnContainer.style.gridRow = "3";    // 3行目（右下の一番隅っこ）
            
            btnContainer.innerHTML = `<button class="confirm-btn" onclick="saveSelection()">選択完了</button>`;
            container.appendChild(btnContainer);
        }

        // 4. 選択完了ボタンを押した時の処理
        function saveSelection() {
            localStorage.setItem("selectedChar", tempSelectedChar);
            // ホーム画面（game.html）に戻る
            window.location.href = "game.html";
        }

        // 画面を開いた時にグリッドを実行する
        renderGrid();
    </script>
</body>
</html>

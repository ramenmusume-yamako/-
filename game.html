<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ミニゲーム選択 | ラーメン娘</title>
    <link rel="stylesheet" href="game.css">
</head>
<header>
    <div class="hamburger-menu">
        <input type="checkbox" id="menu-btn-check">
        <label for="menu-btn-check" class="menu-btn"><span></span></label>
        <div class="menu-content">
            <ul>
                <li><a href="index.html">ホーム</a></li>
                <li><a href="character.html">キャラ紹介</a></li>
                <li><a href="game.html">ミニゲーム</a></li>
                <li><a href="news.html">お知らせ</a></li>
            </ul>
        </div>
    </div>
</header>
<body class="game-page-theme">

    <main class="game-container">
        
        <div class="game-top-row">
            
　　　　　　　
            <a href="select.html" class="char-select-btn">
    <div class="btn-char-container">
        <img id="btnCharImg" src="" alt="">
    </div>
</a>

            <div class="game-title-kanban">
                <span class="kanban-sub">ミニゲーム</span>
                <h1 class="game-main-name">走れ！ラーメン娘！！</h1>
                <p class="game-desc">障害物を避けてなるべく長く走り続けよう！</p>
            </div>

        </div>

        <div class="difficulty-section">
            <h2 class="section-title">難易度を選択してゲームスタート！</h2>
            
            <div class="difficulty-grid">
                
                <a href="easy.html" class="diff-card card-easy">
                    <div class="card-inner">
                        <span class="diff-eng">easy</span>
                        <h3 class="diff-jp">初見</h3>
                        <p class="diff-note">初めての方向け</p>
                    </div>
                </a>

                <a href="nomal.html" class="diff-card card-normal">
                    <div class="card-inner">
                        <span class="diff-eng">normal</span>
                        <h3 class="diff-jp">一般客</h3>
                        <p class="diff-note">標準的難易度</p>
                    </div>
                </a>

                <a href="hard.html" class="diff-card card-hard">
                    <div class="card-inner">
                        <span class="diff-eng">hard</span>
                        <h3 class="diff-jp">常連</h3>
                        <p class="diff-note">ここまできたらプロ！？</p>
                    </div>
                </a>

            </div>
        </div>
<div class="game-chara-section">
            <h2 class="section-title">障害具材</h2>
            
            <div class="game-chara-grid">
                
                <div class="game-chara-card">
                    <div class="mini-img-wrap">
                        <img src="naruto.png" alt="ナルットゥ">
                    </div>
                    <h3 class="mini-name">ナルットゥ</h3>
                    <p class="mini-word">邪悪なナルト</p>
                </div>

                <div class="game-chara-card">
                    <div class="mini-img-wrap">
                        <img src="nori.png" alt="ノリノリノリ夫">
                    </div>
                    <h3 class="mini-name">ノリノリノリ夫</h3>
                    <p class="mini-word">いつも踊っている<br>ペラペラな海苔</p>
                </div>

                <div class="game-chara-card">
                    <div class="mini-img-wrap">
                        <img src="menma2.png" alt="イカレ目ンマ">
                    </div>
                    <h3 class="mini-name">イカレ目ンマ</h3>
                    <p class="mini-word">ｱﾀﾏｶﾞｲｶﾚﾁｬｯﾀﾖ☆</p>
                </div>

                <div class="game-chara-card">
                    <div class="mini-img-wrap">
                        <img src="tya-syu-.png" alt="チューシュー">
                    </div>
                    <h3 class="mini-name">チューシュー</h3>
                    <p class="mini-word">キュルキュルお目目で<br>あなたにキスを迫る</p>
                </div>

            </div>
        </div>
    </main>

    <footer class="shop-footer">
        <p>&copy; 2026 ramengirls</p>
    </footer>

   <script>
        document.addEventListener("DOMContentLoaded", () => {
            // ★実際のフォルダ内にあるファイル名に完全に一致させました！
            const CHAR_IMAGES = {
                hajime: "right.png",    /* 初期キャラ・ハジメの画像 */
                meana:  "meanal.png",   /* メーナの画像 */
                boy:    "boy_l.png",    /* 中華ボーイの画像 */
                aniki:  "aniki_l.png",  /* チャーシュー兄の画像 */
                naruto: "naruto_l.png"  /* ナルトちゃんの画像 */
            };

            // 現在選択されているキャラクターのIDをストレージから取得
            const currentSelected = localStorage.getItem("selectedChar") || "hajime";
            const btnCharImg = document.getElementById("btnCharImg");

            if (btnCharImg && CHAR_IMAGES[currentSelected]) {
                btnCharImg.src = CHAR_IMAGES[currentSelected];
            }
        });
    </script>
</body>
</html>

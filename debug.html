<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>デバッグページ | ラーメン娘</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: sans-serif;
            background-color: #1e1e1e;
            color: #d4d4d4;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* サイドバー */
        .sidebar {
            width: 220px;
            background-color: #252526;
            border-right: 1px solid #3c3c3c;
            display: flex;
            flex-direction: column;
        }
        .sidebar-title {
            padding: 15px;
            font-size: 1.1rem;
            font-weight: bold;
            color: #569cd6;
            border-bottom: 1px solid #3c3c3c;
        }
        .nav-list {
            list-style: none;
        }
        .nav-item {
            padding: 12px 20px;
            cursor: pointer;
            border-bottom: 1px solid #2d2d2d;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .nav-item:hover, .nav-item.active {
            background-color: #37373d;
            color: #fff;
        }

        /* メインコンテンツ */
        .content {
            flex: 1;
            padding: 25px;
            overflow-y: auto;
        }
        .section-title {
            font-size: 1.4rem;
            margin-bottom: 20px;
            border-bottom: 2px solid #007acc;
            padding-bottom: 8px;
            color: #fff;
        }

        /* スイッチなどのコントロール */
        .control-group {
            background-color: #2d2d2d;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 26px;
        }
        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #555;
            transition: .3s;
            border-radius: 26px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 18px; width: 18px;
            left: 4px; bottom: 4px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }
        input:checked + .slider {
            background-color: #0e639c;
        }
        input:checked + .slider:before {
            transform: translateX(24px);
        }

        /* 日付選択 */
        .date-picker-wrap {
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .date-picker-wrap input {
            background-color: #3c3c3c;
            border: 1px solid #555;
            color: #fff;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 1rem;
        }

        /* スコアカードグリッド */
        .score-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 15px;
        }
        .score-card {
            background-color: #2d2d2d;
            border-radius: 8px;
            padding: 15px;
            border-top: 4px solid #555;
        }
        .score-card.easy { border-color: #4caf50; }
        .score-card.normal { border-color: #ff9800; }
        .score-card.hard { border-color: #f44336; }

        .score-card h3 {
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .badge {
            font-size: 0.75rem;
            padding: 3px 8px;
            border-radius: 12px;
            color: #fff;
        }
        .bg-easy { background-color: #4caf50; }
        .bg-normal { background-color: #ff9800; }
        .bg-hard { background-color: #f44336; }

        .stat-line {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px solid #3c3c3c;
            font-size: 0.9rem;
        }

        .score-history {
            margin-top: 10px;
            max-height: 150px;
            overflow-y: auto;
            background: #222;
            padding: 8px;
            border-radius: 4px;
            font-size: 0.85rem;
        }
        .score-history-item {
            display: flex;
            justify-content: space-between;
            padding: 3px 0;
            color: #aaa;
        }

        /* 戻るボタン */
        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #569cd6;
            text-decoration: none;
        }
        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-title">🔧 デバッグパネル</div>
        <ul class="nav-list">
            <li class="nav-item active" onclick="switchTab('setting')">⚙️ 設定</li>
            <li class="nav-item" onclick="switchTab('pv')">📊 PV閲覧数</li>
            <li class="nav-item" onclick="switchTab('game')">🎮 ゲームスコア</li>
        </ul>
    </div>

    <div class="content">
        <!-- 1. 設定タブ -->
        <div id="tab-setting" class="tab-content">
            <h2 class="section-title">一般設定</h2>
            <div class="control-group">
                <div>
                    <strong>デバッグモード</strong>
                    <p style="font-size: 0.85rem; color: #aaa;">有効にすると、お知らせ投稿・削除ボタンが表示されます。</p>
                </div>
                <label class="switch">
                    <input type="checkbox" id="debug-toggle">
                    <span class="slider"></span>
                </label>
            </div>
            <a href="index.html" class="back-link">← ホームへ戻る</a>
        </div>

        <!-- 2. PV閲覧数タブ -->
        <div id="tab-pv" class="tab-content" style="display: none;">
            <h2 class="section-title">PV（アクセス数）ログ</h2>
            <div id="pv-list"></div>
        </div>

        <!-- 3. ゲームスコアタブ -->
        <div id="tab-game" class="tab-content" style="display: none;">
            <h2 class="section-title">難易度別ゲームスコア</h2>
            
            <div class="date-picker-wrap">
                <label for="game-date">日付選択：</label>
                <input type="date" id="game-date">
            </div>

            <div class="score-grid">
                <!-- Easy -->
                <div class="score-card easy">
                    <h3>Easy <span class="badge bg-easy">初級</span></h3>
                    <div id="easy-stats"></div>
                </div>

                <!-- Normal -->
                <div class="score-card normal">
                    <h3>Normal <span class="badge bg-normal">中級</span></h3>
                    <div id="normal-stats"></div>
                </div>

                <!-- Hard -->
                <div class="score-card hard">
                    <h3>Hard <span class="badge bg-hard">上級</span></h3>
                    <div id="hard-stats"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // デバッグモード状態管理
        const debugToggle = document.getElementById('debug-toggle');
        const isDebug = localStorage.getItem('debug_mode') === 'true';
        debugToggle.checked = isDebug;

        debugToggle.addEventListener('change', (e) => {
            localStorage.setItem('debug_mode', e.target.checked);
        });

        // タブ切り替え
        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.style.display = 'none');
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));

            document.getElementById(`tab-${tabName}`).style.display = 'block';
            event.currentTarget.classList.add('active');

            if (tabName === 'pv') renderPV();
            if (tabName === 'game') renderGameScores();
        }

        // PVレンダリング
        function renderPV() {
            const pvData = JSON.parse(localStorage.getItem('site_pv_data') || '{}');
            const container = document.getElementById('pv-list');
            const dates = Object.keys(pvData).sort().reverse();

            if (dates.length === 0) {
                container.innerHTML = '<p>PVデータはありません。</p>';
                return;
            }

            container.innerHTML = dates.map(d => `
                <div class="stat-line" style="background:#2d2d2d; margin-bottom:5px; padding:10px; border-radius:4px;">
                    <span>${d}</span>
                    <strong style="color:#569cd6;">${pvData[d]} PV</strong>
                </div>
            `).join('');
        }

        // ゲームスコアレンダリング
        const gameDateInput = document.getElementById('game-date');
        const todayStr = new Date().toISOString().split('T')[0];
        gameDateInput.value = todayStr;

        gameDateInput.addEventListener('change', renderGameScores);

        function renderGameScores() {
            const selectedDate = gameDateInput.value;
            const gameData = JSON.parse(localStorage.getItem('site_game_scores') || '{}');
            const dayData = gameData[selectedDate] || { easy: [], normal: [], hard: [] };

            ['easy', 'normal', 'hard'].forEach(diff => {
                const list = dayData[diff] || [];
                const container = document.getElementById(`${diff}-stats`);

                if (list.length === 0) {
                    container.innerHTML = '<p style="color:#888; margin-top:10px; font-size:0.85rem;">プレイ記録なし</p>';
                    return;
                }

                const scores = list.map(item => item.score);
                const maxScore = Math.max(...scores);
                const avgScore = Math.round(scores.reduce((a, b) => a + b, 0) / scores.length);

                const historyHTML = list.map(item => `
                    <div class="score-history-item">
                        <span>⏰ ${item.time}</span>
                        <strong style="color:#fff;">${item.score.toLocaleString()} pt</strong>
                    </div>
                `).join('');

                container.innerHTML = `
                    <div class="stat-line"><span>プレイ回数</span><strong>${list.length} 回</strong></div>
                    <div class="stat-line"><span>最高スコア</span><strong style="color:#4ec9b0;">${maxScore.toLocaleString()} pt</strong></div>
                    <div class="stat-line"><span>平均スコア</span><strong>${avgScore.toLocaleString()} pt</strong></div>
                    
                    <div style="margin-top:10px; font-weight:bold; font-size:0.8rem; color:#aaa;">履歴一覧:</div>
                    <div class="score-history">${historyHTML}</div>
                `;
            });
        }
    </script>
</body>
</html>

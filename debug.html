<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>走れ！ラーメン娘！！ - デバッグ＆スコアログ</title>
    <style>
        :root {
            --bg-color: #2c3e50;
            --card-bg: rgba(0, 0, 0, 0.5);
            --border-color: #e67e22;
            --accent-gold: #f1c40f;
            --text-color: #ffffff;
            --btn-easy: #27ae60;
            --btn-normal: #d35400;
            --btn-hard: #c0392b;
        }

        body {
            margin: 0;
            padding: 20px;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: sans-serif;
            box-sizing: border-box;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: rgba(0, 0, 0, 0.75);
            border: 3px solid var(--border-color);
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 0 35px rgba(0,0,0,0.8);
            box-sizing: border-box;
        }

        h1 {
            color: var(--accent-gold);
            text-align: center;
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 26px;
            letter-spacing: 0.1em;
            border-bottom: 2px dashed var(--border-color);
            padding-bottom: 12px;
        }

        h2 {
            color: var(--accent-gold);
            font-size: 18px;
            margin-top: 0;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            padding-bottom: 6px;
        }

        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 20px;
        }

        /* ボタンデザイン */
        .btn {
            background: var(--bg-color);
            color: white;
            border: 2px solid white;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s;
            display: inline-block;
            user-select: none;
        }

        .btn:hover {
            background: var(--border-color);
            border-color: var(--accent-gold);
            transform: scale(1.03);
        }

        .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .btn-success {
            background: #27ae60;
            border-color: #2ecc71;
        }
        .btn-success:hover { background: #2ecc71; }

        .btn-danger {
            background: #800000;
            border-color: #ff4d4d;
        }
        .btn-danger:hover { background: #b30000; }

        /* スコアグリッド */
        .difficulty-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 15px;
        }

        .diff-box {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 6px;
            padding: 12px;
            border-left: 4px solid #7f8c8d;
        }

        .diff-box.easy   { border-left-color: var(--btn-easy); }
        .diff-box.normal { border-left-color: var(--btn-normal); }
        .diff-box.hard   { border-left-color: var(--btn-hard); }

        .diff-name {
            font-weight: bold;
            font-size: 15px;
            margin-bottom: 8px;
        }

        .easy .diff-name   { color: #2ecc71; }
        .normal .diff-name { color: #e67e22; }
        .hard .diff-name   { color: #e74c3c; }

        .score-list {
            list-style: none;
            padding: 0;
            margin: 0;
            font-size: 13px;
        }

        .score-item {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
            border-bottom: 1px dotted rgba(255, 255, 255, 0.1);
        }

        /* JSON生データエリア */
        pre {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 12px;
            border-radius: 6px;
            color: #2ecc71;
            font-family: monospace;
            font-size: 12px;
            overflow-x: auto;
            max-height: 250px;
        }

        .status-badge {
            background: #e67e22;
            color: #fff;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 13px;
            font-weight: bold;
        }

        .empty-msg {
            color: #7f8c8d;
            font-style: italic;
            font-size: 13px;
        }

        @media (max-width: 600px) {
            body { padding: 10px; }
            .container { padding: 15px; }
            h1 { font-size: 20px; }
            .top-nav { flex-direction: column; gap: 10px; align-items: stretch; }
            .btn { text-align: center; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🛠️ デバッグ ＆ 開発者ツール</h1>

        <div class="top-nav">
            <a href="game.html" class="btn">🏠 ホームページに戻る</a>
            <button class="btn btn-danger" onclick="clearAllLocalStorage()">⚠️ 全データ完全リセット</button>
        </div>

        <!-- 1. キャラクターステータス & 操作 -->
        <div class="card">
            <h2>👤 キャラクターデータ操作</h2>
            <p style="margin-top: 0; font-size: 14px;">
                現在の選択キャラ: <span id="current-char-display" class="status-badge">読み込み中...</span>
            </p>
            <div class="btn-group">
                <button class="btn btn-success" onclick="unlockAllCharacters()">🔓 全キャラ即時開放</button>
                <button class="btn" onclick="setChar('hajime')">はじめに変更</button>
                <button class="btn" onclick="setChar('meana')">メアナに変更</button>
                <button class="btn" onclick="setChar('aniki')">アニキに変更</button>
                <button class="btn" onclick="setChar('naruto')">ナルトに変更</button>
            </div>
        </div>

        <!-- 2. 日付別 プレイログ -->
        <div class="card">
            <h2>📅 日付別プレイログ (日別スコア)</h2>
            <div class="btn-group" style="margin-bottom: 12px;">
                <button class="btn btn-danger" onclick="clearGameScoresLog()">🗑️ スコアログのみ削除</button>
            </div>
            <div id="log-container">
                <!-- JSで展開 -->
            </div>
        </div>

        <!-- 3. LocalStorage 全データの確認 -->
        <div class="card">
            <h2>🔍 LocalStorage 生データ一覧</h2>
            <div class="btn-group" style="margin-bottom: 12px;">
                <button class="btn" onclick="renderAllData()">🔄 表示を更新</button>
            </div>
            <pre id="raw-storage-display">データがありません</pre>
        </div>
    </div>

    <script>
        // ページ読み込み時の処理
        function initDebug() {
            updateCharDisplay();
            loadLogs();
            renderAllData();
        }

        // --- キャラクター関連 ---
        function updateCharDisplay() {
            const char = localStorage.getItem('selectedChar') || 'hajime (初期値)';
            document.getElementById('current-char-display').textContent = char;
        }

        function setChar(charId) {
            localStorage.setItem('selectedChar', charId);
            updateCharDisplay();
            renderAllData();
            alert(`選択キャラを [ ${charId} ] に変更しました！`);
        }

        function unlockAllCharacters() {
            // キャラクタ一括解放用フラグ等の書き込み
            localStorage.setItem('unlocked_meana', 'true');
            localStorage.setItem('unlocked_aniki', 'true');
            localStorage.setItem('unlocked_naruto', 'true');
            renderAllData();
            alert('全キャラクターを開放状態にセットしました！');
        }

        // --- ログ関連 ---
        function loadLogs() {
            const container = document.getElementById('log-container');
            const rawData = localStorage.getItem('site_game_scores');

            if (!rawData) {
                container.innerHTML = '<p class="empty-msg">保存されているログデータはありません。</p>';
                return;
            }

            const gameData = JSON.parse(rawData);
            const dates = Object.keys(gameData).sort().reverse();

            if (dates.length === 0) {
                container.innerHTML = '<p class="empty-msg">保存されているログデータはありません。</p>';
                return;
            }

            let html = '';
            dates.forEach(date => {
                const dayData = gameData[date];
                html += `
                    <div style="background: rgba(0,0,0,0.3); padding: 12px; border-radius: 6px; margin-bottom: 12px; border: 1px solid rgba(255,255,255,0.1);">
                        <div style="font-size: 16px; color: var(--accent-gold); margin-bottom: 10px; font-weight: bold;">📅 ${date}</div>
                        <div class="difficulty-grid">
                            ${renderDifficultyBox('EASY', dayData.easy, 'easy')}
                            ${renderDifficultyBox('NORMAL', dayData.normal, 'normal')}
                            ${renderDifficultyBox('HARD', dayData.hard, 'hard')}
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        function renderDifficultyBox(title, scores, className) {
            let listHtml = '';
            if (scores && scores.length > 0) {
                const reversedScores = [...scores].reverse();
                listHtml = '<ul class="score-list">' + 
                    reversedScores.map(item => `
                        <li class="score-item">
                            <span>⏱️ ${item.time}</span>
                            <span><strong>${item.score}</strong> 秒</span>
                        </li>
                    `).join('') + 
                '</ul>';
            } else {
                listHtml = '<div class="empty-msg">記録なし</div>';
            }

            return `
                <div class="diff-box ${className}">
                    <div class="diff-name">${title}</div>
                    ${listHtml}
                </div>
            `;
        }

        // --- リセット関連 ---
        function clearGameScoresLog() {
            if (confirm('プレイログ（日付ごとのスコア履歴）のみ削除しますか？\n※ハイスコアやキャラ解放状況は保持されます。')) {
                localStorage.removeItem('site_game_scores');
                initDebug();
            }
        }

        function clearAllLocalStorage() {
            if (confirm('【注意】ハイスコア、全開放フラグ、ログを含むすべての保存データを消去しますか？')) {
                localStorage.clear();
                initDebug();
                alert('すべてのデータをリセットしました。');
            }
        }

        // --- Rawストレージ表示 ---
        function renderAllData() {
            const display = document.getElementById('raw-storage-display');
            const data = {};
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                try {
                    data[key] = JSON.parse(localStorage.getItem(key));
                } catch(e) {
                    data[key] = localStorage.getItem(key);
                }
            }
            display.textContent = JSON.stringify(data, null, 2);
        }

        window.addEventListener('DOMContentLoaded', initDebug);
    </script>
</body>
</html>

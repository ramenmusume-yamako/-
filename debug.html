<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>デバッグ管理画面 - ラーメン娘</title>
    <link rel="stylesheet" href="hp.css">
    <link rel="stylesheet" href="debug.css">
</head>
<body>

    <main class="debug-container">
        <h1 class="debug-title">🔧 デバッグ管理パネル</h1>

        <!-- 1. 閲覧数表示エリア -->
        <section class="debug-card">
            <h2>📊 日別閲覧数（PV）</h2>
            <ul id="pv-list" class="pv-list">
                <!-- JSでここに日付ごとの閲覧数が挿入されます -->
            </ul>
        </section>

        <!-- 2. ゲームスコア表示エリア (新規追加) -->
        <section class="debug-card">
            <h2>🎮 ゲームプレイログ（難易度別）</h2>
            
            <div class="debug-date-picker">
                <label for="score-date">日付を選択：</label>
                <input type="date" id="score-date">
            </div>

            <div class="debug-score-section">
                <h3>EASY モード (easy.html)</h3>
                <ul id="easy-score-list" class="pv-list">
                    <li class="pv-empty">日付を選択してください。</li>
                </ul>

                <h3>NORMAL モード (normal.html)</h3>
                <ul id="normal-score-list" class="pv-list">
                    <li class="pv-empty">日付を選択してください。</li>
                </ul>

                <h3>HARD モード (hard.html)</h3>
                <ul id="hard-score-list" class="pv-list">
                    <li class="pv-empty">日付を選択してください。</li>
                </ul>
            </div>
        </section>

        <!-- 3. 設定・操作エリア -->
        <section class="debug-card">
            <h2>⚙️ 操作</h2>
            <button id="exit-debug-btn" class="debug-btn-danger">デバッグモードを終了する</button>
        </section>

        <div class="debug-back-link">
            <a href="index.html">← ホームへ戻る</a>
        </div>
    </main>

    <script>
        // 1. デバッグモードの判定（無効ならTOPへリダイレクト）
        if (localStorage.getItem('debug_mode') !== 'true') {
            alert('アクセス権限がありません。');
            window.location.href = 'index.html';
        }

        document.addEventListener('DOMContentLoaded', () => {
            // 2. 保存されているPVデータの読み込み＆表示
            const pvData = JSON.parse(localStorage.getItem('site_pv_data') || '{}');
            const pvList = document.getElementById('pv-list');

            const entries = Object.entries(pvData).reverse(); // 新しい日付順にソート

            if (entries.length === 0) {
                pvList.innerHTML = '<li class="pv-empty">データがまだありません。</li>';
            } else {
                pvList.innerHTML = entries.map(([date, count]) => `
                    <li class="pv-item">
                        <span class="pv-date">${date}</span>
                        <span class="pv-count">${count} PV</span>
                    </li>
                `).join('');
            }

            // 3. ゲームスコア（日付別・難易度別）の読み込み設定
            const scoreDateInput = document.getElementById('score-date');
            
            // 初期値として今日の日付をセット
            const today = new Date().toISOString().split('T')[0];
            scoreDateInput.value = today;
            loadScoresForDate(today);

            // 日付変更時のイベント
            scoreDateInput.addEventListener('change', (e) => {
                loadScoresForDate(e.target.value);
            });

            // 4. デバッグモード解除ボタンの処理
            document.getElementById('exit-debug-btn').addEventListener('click', () => {
                localStorage.removeItem('debug_mode');
                alert('デバッグモードを解除しました。');
                window.location.href = 'index.html';
            });
        });

        // 日付ごとの全プレイヤーのスコアを取得して表示する関数
        function loadScoresForDate(selectedDate) {
            // 全プレイヤーのログ（easy.html, normal.html, hard.html から保存された共通データ）
            const allScores = JSON.parse(localStorage.getItem('all_players_game_scores') || '{}');
            const dayScores = allScores[selectedDate] || { easy: [], normal: [], hard: [] };

            renderDifficultyList('easy-score-list', dayScores.easy);
            renderDifficultyList('normal-score-list', dayScores.normal);
            renderDifficultyList('hard-score-list', dayScores.hard);
        }

        function renderDifficultyList(elementId, scores) {
            const listElem = document.getElementById(elementId);

            if (!scores || scores.length === 0) {
                listElem.innerHTML = '<li class="pv-empty">この日のプレイ記録はありません。</li>';
                return;
            }

            // 新しい順に表示
            const reversed = [...scores].reverse();
            listElem.innerHTML = reversed.map(item => `
                <li class="pv-item">
                    <span class="pv-date">${item.time || ''} ${item.user ? `[${item.user}]` : ''}</span>
                    <span class="pv-count">${item.score} 秒</span>
                </li>
            `).join('');
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>走れ！ラーメン娘！！ - スコアログ・デバッグ</title>
    <style>
        :root {
            --bg-color: #2c3e50;
            --card-bg: rgba(0, 0, 0, 0.4);
            --border-color: #e67e22;
            --accent-gold: #f1c40f;
            --text-color: #ffffff;
            --btn-easy: #27ae60;
            --btn-normal: #d35400;
            --btn-hard: #c0392b;
        }

        body {
            margin: 0;
            padding: 20px;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: sans-serif;
            box-sizing: border-box;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: rgba(0, 0, 0, 0.7);
            border: 3px solid var(--border-color);
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
            box-sizing: border-box;
        }

        h1 {
            color: var(--accent-gold);
            text-align: center;
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 28px;
            letter-spacing: 0.1em;
            border-bottom: 2px dashed var(--border-color);
            padding-bottom: 10px;
        }

        .actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .btn {
            background: var(--bg-color);
            color: white;
            border: 2px solid white;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s;
            display: inline-block;
        }

        .btn:hover {
            background: var(--border-color);
            border-color: var(--accent-gold);
            transform: scale(1.03);
        }

        .btn-danger {
            background: #800000;
            border-color: #ff4d4d;
        }

        .btn-danger:hover {
            background: #b30000;
            border-color: #ffffff;
        }

        /* 日付ブロック */
        .date-card {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .date-title {
            font-size: 20px;
            color: var(--accent-gold);
            margin: 0 0 15px 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .difficulty-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 15px;
        }

        .diff-box {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 6px;
            padding: 12px;
            border-left: 4px solid #7f8c8d;
        }

        .diff-box.easy   { border-left-color: var(--btn-easy); }
        .diff-box.normal { border-left-color: var(--btn-normal); }
        .diff-box.hard   { border-left-color: var(--btn-hard); }

        .diff-name {
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .easy .diff-name   { color: #2ecc71; }
        .normal .diff-name { color: #e67e22; }
        .hard .diff-name   { color: #e74c3c; }

        .score-list {
            list-style: none;
            padding: 0;
            margin: 0;
            font-size: 14px;
        }

        .score-item {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
            border-bottom: 1px dotted rgba(255, 255, 255, 0.1);
        }

        .score-item:last-child {
            border-bottom: none;
        }

        .empty-msg {
            color: #7f8c8d;
            font-style: italic;
            font-size: 13px;
        }

        @media (max-width: 600px) {
            body { padding: 10px; }
            .container { padding: 15px; }
            h1 { font-size: 20px; }
            .actions { flex-direction: column; align-items: stretch; }
            .btn { text-align: center; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🍜 プレイ記録ログ (デバッグ)</h1>

        <div class="actions">
            <a href="game.html" class="btn">🏠 ホームページに戻る</a>
            <button class="btn btn-danger" onclick="clearLogs()">🗑️ ログデータを全削除</button>
        </div>

        <div id="log-container">
            <!-- JavaScriptでここに日付ごとのデータが挿入されます -->
        </div>
    </div>

    <script>
        function loadLogs() {
            const container = document.getElementById('log-container');
            const rawData = localStorage.getItem('site_game_scores');

            if (!rawData) {
                container.innerHTML = '<p class="empty-msg" style="text-align:center; font-size:16px;">保存されているログデータはありません。</p>';
                return;
            }

            const gameData = JSON.parse(rawData);
            const dates = Object.keys(gameData).sort().reverse(); // 新しい日付順

            if (dates.length === 0) {
                container.innerHTML = '<p class="empty-msg" style="text-align:center; font-size:16px;">保存されているログデータはありません。</p>';
                return;
            }

            let html = '';

            dates.forEach(date => {
                const dayData = gameData[date];
                html += `
                    <div class="date-card">
                        <div class="date-title">📅 ${date}</div>
                        <div class="difficulty-grid">
                            ${renderDifficultyBox('EASY', dayData.easy, 'easy')}
                            ${renderDifficultyBox('NORMAL', dayData.normal, 'normal')}
                            ${renderDifficultyBox('HARD', dayData.hard, 'hard')}
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        function renderDifficultyBox(title, scores, className) {
            let listHtml = '';
            
            if (scores && scores.length > 0) {
                // 時間の新しい順に表示
                const reversedScores = [...scores].reverse();
                listHtml = '<ul class="score-list">' + 
                    reversedScores.map(item => `
                        <li class="score-item">
                            <span>⏱️ ${item.time}</span>
                            <span><strong>${item.score}</strong> 秒</span>
                        </li>
                    `).join('') + 
                '</ul>';
            } else {
                listHtml = '<div class="empty-msg">記録なし</div>';
            }

            return `
                <div class="diff-box ${className}">
                    <div class="diff-name">${title}</div>
                    ${listHtml}
                </div>
            `;
        }

        function clearLogs() {
            if (confirm('本当にすべてのプレイログを削除しますか？\n（最高記録TOP3などは削除されません）')) {
                localStorage.removeItem('site_game_scores');
                loadLogs();
            }
        }

        // ページ読み込み時に実行
        window.addEventListener('DOMContentLoaded', loadLogs);
    </script>
</body>
</html>

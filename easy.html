<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Runner Game</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #111;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            background-color: #222;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
            display: block;
        }

        /* メニューオーバーレイ（中央配置に修正） */
        #game-menu-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 999;
            background: rgba(0, 0, 0, 0.85);
            border: 2px solid #555;
            padding: 20px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            min-width: 280px;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
        }

        #game-menu-overlay h2 {
            text-align: center;
            font-size: 20px;
            border-bottom: 1px solid #444;
            padding-bottom: 8px;
            margin-bottom: 5px;
        }

        .menu-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .menu-item.selected {
            background-color: #444;
            font-weight: bold;
            color: #ffeb3b;
        }

        .menu-item .key-hint {
            font-size: 12px;
            color: #aaa;
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <!-- ポーズ／設定メニュー -->
    <div id="game-menu-overlay" style="display: none;">
        <h2>MENU</h2>
        <div class="menu-item selected" data-index="0">
            <span>Resume</span>
            <span class="key-hint">[Enter]</span>
        </div>
        <div class="menu-item" data-index="1">
            <span>Restart</span>
            <span class="key-hint">[R]</span>
        </div>
        <div class="menu-item" data-index="2">
            <span>Sound: <span id="sound-status">ON</span></span>
            <span class="key-hint">[M]</span>
        </div>
    </div>
</div>

<script>
// --- 基本設定 & 定数 ---
const V_WIDTH = 800;
const V_HEIGHT = 450;
const GROUND_Y = 380;

const STATE = {
    TITLE: 0,
    PLAYING: 1,
    GAMEOVER: 2
};

let gameState = STATE.TITLE;

// Canvas & コンテキストの設定
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const menuOverlay = document.getElementById('game-menu-overlay');
const menuItems = document.querySelectorAll('.menu-item');
const soundStatusEl = document.getElementById('sound-status');

let selectedMenuIndex = 0;
let isMuted = false;

// 背景画像
const bgSrcs = ['bg1.png', 'bg2.png']; // 任意の画像パス
const bgImages = [];
let bgReadyCount = 0;

bgSrcs.forEach((src) => {
    const img = new Image();
    img.src = src;
    img.onload = () => { bgReadyCount++; };
    bgImages.push(img);
});

// ゲーム変数
let lastTime = 0;
let bgScroll = 0;
let score = 0;
let highScore = parseInt(localStorage.getItem('runner_highscore') || '0', 10);
let topScores = JSON.parse(localStorage.getItem('runner_top3') || '[0, 0, 0]');

// プレイヤーオブジェクト
const player = {
    x: 100,
    y: GROUND_Y - 40,
    width: 40,
    height: 40,
    vy: 0,
    gravity: 1500,
    jumpForce: -600,
    isGrounded: true,
    reset() {
        this.y = GROUND_Y - this.height;
        this.vy = 0;
        this.isGrounded = true;
    },
    update(dt) {
        if (!this.isGrounded) {
            this.vy += this.gravity * dt;
            this.y += this.vy * dt;
            if (this.y >= GROUND_Y - this.height) {
                this.y = GROUND_Y - this.height;
                this.vy = 0;
                this.isGrounded = true;
            }
        }
    },
    jump() {
        if (this.isGrounded) {
            this.vy = this.jumpForce;
            this.isGrounded = false;
        }
    },
    draw() {
        ctx.fillStyle = '#ff4081';
        ctx.fillRect(this.x, this.y, this.width, this.height);
    }
};

// 障害物管理
let obstacles = [];
let obstacleTimer = 0;

function spawnObstacle() {
    obstacles.push({
        x: V_WIDTH,
        y: GROUND_Y - 30,
        width: 30,
        height: 30,
        speed: 300
    });
}

function updateObstacles(dt) {
    obstacleTimer += dt;
    if (obstacleTimer > 1.8) {
        spawnObstacle();
        obstacleTimer = 0;
    }

    for (let i = obstacles.length - 1; i >= 0; i--) {
        let obs = obstacles[i];
        obs.x -= obs.speed * dt;

        // 衝突判定
        if (
            player.x < obs.x + obs.width &&
            player.x + player.width > obs.x &&
            player.y < obs.y + obs.height &&
            player.y + player.height > obs.y
        ) {
            triggerGameOver();
        }

        // 画面外削除
        if (obs.x + obs.width < 0) {
            obstacles.splice(i, 1);
        }
    }
}

function drawObstacles() {
    ctx.fillStyle = '#00e676';
    obstacles.forEach(obs => {
        ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
    });
}

// レスポンシブキャンバスサイズ調整
function resizeCanvas() {
    const windowWidth = window.innerWidth;
    const windowHeight = window.innerHeight;
    const scale = Math.min(windowWidth / V_WIDTH, windowHeight / V_HEIGHT);

    canvas.width = V_WIDTH * scale;
    canvas.height = V_HEIGHT * scale;
    ctx.imageSmoothingEnabled = false;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// --- ゲーム状態管理 ---
function resetGame() {
    score = 0;
    bgScroll = 0;
    obstacles = [];
    obstacleTimer = 0;
    player.reset();
}

function triggerGameOver() {
    gameState = STATE.GAMEOVER;
    
    // スコア更新
    if (score > highScore) {
        highScore = Math.floor(score);
        localStorage.setItem('runner_highscore', highScore);
    }
    topScores.push(Math.floor(score));
    topScores.sort((a, b) => b - a);
    topScores = topScores.slice(0, 3);
    localStorage.setItem('runner_top3', JSON.stringify(topScores));
}

// --- メニュー操作 ---
function toggleMenu(show) {
    if (show) {
        menuOverlay.style.display = 'flex';
        updateMenuUI();
    } else {
        menuOverlay.style.display = 'none';
    }
}

function updateMenuUI() {
    menuItems.forEach((item, idx) => {
        if (idx === selectedMenuIndex) {
            item.classList.add('selected');
        } else {
            item.classList.remove('selected');
        }
    });
    soundStatusEl.textContent = isMuted ? 'OFF' : 'ON';
}

function handleMenuAction() {
    if (selectedMenuIndex === 0) {
        // Resume
        toggleMenu(false);
    } else if (selectedMenuIndex === 1) {
        // Restart
        toggleMenu(false);
        resetGame();
        gameState = STATE.PLAYING;
    } else if (selectedMenuIndex === 2) {
        // Sound Toggle
        isMuted = !isMuted;
        updateMenuUI();
    }
}

// --- 入力イベント処理 ---
function handleInput() {
    if (gameState === STATE.TITLE) {
        resetGame();
        gameState = STATE.PLAYING;
    } else if (gameState === STATE.PLAYING) {
        player.jump();
    } else if (gameState === STATE.GAMEOVER) {
        resetGame();
        gameState = STATE.PLAYING;
    }
}

window.addEventListener('keydown', (e) => {
    // メニューが開いている場合
    if (menuOverlay.style.display === 'flex') {
        if (e.key === 'ArrowUp') {
            selectedMenuIndex = (selectedMenuIndex - 1 + menuItems.length) % menuItems.length;
            updateMenuUI();
        } else if (e.key === 'ArrowDown') {
            selectedMenuIndex = (selectedMenuIndex + 1) % menuItems.length;
            updateMenuUI();
        } else if (e.key === 'Enter' || e.key === ' ') {
            handleMenuAction();
        } else if (e.key === 'Escape') {
            toggleMenu(false);
        } else if (e.key === 'r' || e.key === 'R') {
            selectedMenuIndex = 1;
            handleMenuAction();
        } else if (e.key === 'm' || e.key === 'M') {
            isMuted = !isMuted;
            updateMenuUI();
        }
        return;
    }

    // 通常時の操作
    if (e.key === 'Escape') {
        if (gameState === STATE.PLAYING) {
            toggleMenu(true);
        }
        return;
    }

    if (e.key === ' ' || e.key === 'ArrowUp' || e.key === 'Enter') {
        handleInput();
    }
});

canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    if (menuOverlay.style.display !== 'flex') {
        handleInput();
    }
});

// --- メインループ & 描画 ---
function update(dt) {
    if (menuOverlay.style.display === 'flex') return; // メニュー表示中は停止

    if (gameState === STATE.PLAYING) {
        bgScroll += 100 * dt;
        score += dt * 10;
        player.update(dt);
        updateObstacles(dt);
    }
}

function draw() {
    // 画面クリアと仮想解像度のスケーリング適用
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.save();
    const scale = canvas.width / V_WIDTH;
    ctx.scale(scale, scale);

    // 背景の描画
    if (bgReadyCount > 0) {
        const totalBgWidth = V_WIDTH * bgSrcs.length;
        let currentBgIndex = Math.floor((bgScroll % totalBgWidth) / V_WIDTH);
        let offsetInBg = (bgScroll % totalBgWidth) % V_WIDTH;

        for (let i = 0; i < 2; i++) {
            let bgIdx = (currentBgIndex + i) % bgSrcs.length;
            let dx = (i * V_WIDTH) - offsetInBg;

            if (bgImages[bgIdx] && bgImages[bgIdx].complete) {
                ctx.drawImage(bgImages[bgIdx], dx, 0, V_WIDTH, V_HEIGHT);
            }
        }
    } else {
        // 画像未読み込み時のフォールバック背景
        ctx.fillStyle = '#333';
        ctx.fillRect(0, 0, V_WIDTH, V_HEIGHT);
    }

    // 地面ラインの描画
    ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
    ctx.fillRect(0, GROUND_Y, V_WIDTH, 4);

    // ゲームオブジェクト描画
    player.draw();
    drawObstacles();

    // UI & スコア描画
    ctx.fillStyle = '#fff';
    ctx.font = '20px monospace';
    ctx.fillText(`SCORE: ${Math.floor(score)}`, 20, 35);
    ctx.fillText(`HIGH: ${highScore}`, 20, 65);

    // タイトル画面のオーバーレイ
    if (gameState === STATE.TITLE) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
        ctx.fillRect(0, 0, V_WIDTH, V_HEIGHT);

        ctx.fillStyle = '#fff';
        ctx.font = 'bold 40px serif';
        ctx.textAlign = 'center';
        ctx.fillText('RUNNER GAME', V_WIDTH / 2, V_HEIGHT / 2 - 20);

        ctx.font = '20px sans-serif';
        ctx.fillText('Press Space or Tap to Start', V_WIDTH / 2, V_HEIGHT / 2 + 30);
    }

    // ゲームオーバー画面のオーバーレイ
    if (gameState === STATE.GAMEOVER) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
        ctx.fillRect(0, 0, V_WIDTH, V_HEIGHT);

        ctx.fillStyle = '#ff5252';
        ctx.font = 'bold 44px serif'; // タイポ修正済
        ctx.textAlign = 'center';
        ctx.fillText('GAME OVER', V_WIDTH / 2, 120);

        ctx.fillStyle = '#fff';
        ctx.font = '20px sans-serif';
        ctx.fillText(`Score: ${Math.floor(score)}`, V_WIDTH / 2, 170);

        // TOP 3 表示
        ctx.font = 'bold 20px serif';
        ctx.fillText('--- TOP 3 ---', V_WIDTH / 2, 220);
        ctx.font = '18px monospace';
        topScores.forEach((s, idx) => {
            ctx.fillText(`${idx + 1}. ${s}`, V_WIDTH / 2, 250 + (idx * 28));
        });

        ctx.font = '16px sans-serif';
        ctx.fillStyle = '#aaa';
        ctx.fillText('Press Space to Retry', V_WIDTH / 2, 360);
    }

    ctx.restore();
}

function gameLoop(timestamp) {
    if (!lastTime) lastTime = timestamp;
    let dt = (timestamp - lastTime) / 1000;
    
    // パフォーマンス急低下時の飛翔を防ぐ上限設定
    if (dt > 0.1) dt = 0.1;

    lastTime = timestamp;

    update(dt);
    draw();

    requestAnimationFrame(gameLoop);
}

// ゲームスタート
requestAnimationFrame(gameLoop);
</script>

</body>
</html>

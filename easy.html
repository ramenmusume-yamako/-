<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>走れ！ラーメン娘！！</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #111;
      font-family: sans-serif;
    }
    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    canvas {
      display: block;
      background-color: #222;
    }
    .ui-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: calc(10px + env(safe-area-inset-top)) calc(10px + env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) calc(10px + env(safe-area-inset-left));
    }
    .menu-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 15px;
      z-index: 100;
    }
    .menu-btn {
      pointer-events: auto;
      padding: 12px 24px;
      font-size: 18px;
      font-weight: bold;
      color: #fff;
      background: linear-gradient(135deg, #ff416c, #ff4b2b);
      border: none;
      border-radius: 25px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      cursor: pointer;
      text-decoration: none;
      text-align: center;
      width: 200px;
    }
    .menu-btn:active {
      transform: scale(0.95);
    }
  </style>
</head>
<body>

<div id="game-container">
  <canvas id="gameCanvas"></canvas>
  
  <div id="menuOverlay" class="menu-overlay" style="display: none;">
    <button id="retryBtn" class="menu-btn">もう一度遊ぶ</button>
    <a href="https://t-kura.github.io/Syanai-Ranking/index.html" class="menu-btn">社内ランキングへ</a>
  </div>
</div>

<script>
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const menuOverlay = document.getElementById('menuOverlay');
  const retryBtn = document.getElementById('retryBtn');

  // PC判定
  const isPC = !('ontouchstart' in window) && navigator.maxTouchPoints === 0;

  // ゲーム基本パラメタ
  let scaleRatio = 1;
  let baseWidth = 800;
  let baseHeight = 450;

  // 速度 loop 管理
  let speedLoopTimer = 0; 
  let currentBaseSpeed = 8; 

  // 画像・音声アセットの読み込み
  const bgSrcs = [
    'hiru.webp',
    'yuu.webp',
    'yoru.webp',
    'asa.webp'
  ];
  const bgImages = [];
  let bgReadyCount = 0;

  bgSrcs.forEach((src) => {
    const img = new Image();
    img.src = src;
    img.onload = () => { bgReadyCount++; };
    bgImages.push(img);
  });

  const playerImg = new Image();
  playerImg.src = 'player.webp';

  const obstacleImg = new Image();
  obstacleImg.src = 'naruto.webp';

  const soundJap = new Audio('dora.mp3');
  soundJap.preload = 'auto';

  const soundBgm = new Audio('bgm.mp3');
  soundBgm.loop = true;

  // ゲーム状態
  const STATE_START = 0;
  const STATE_PLAYING = 1;
  const STATE_GAMEOVER_ANIM = 2;
  const STATE_GAMEOVER_MENU = 3;
  let gameState = STATE_START;

  // プレイヤーオブジェクト
  const player = {
    x: 100,
    y: 0,
    width: isPC ? 84 : 70,
    height: isPC ? 84 : 70,
    vy: 0,
    gravity: isPC ? 0.9 : 0.75,
    jumpPower: isPC ? -17 : -15,
    isGrounded: false,
    groundY: 0
  };

  // 背景ループ管理
  let bgX = 0;

  // 障害物
  let obstacles = [];
  let spawnTimer = 0;

  // スコア・カウントアップ用変数
  let actualRamenCount = 0;
  let displayCount = 0;
  let countUpTimer = null;
  let scoreTextTimer = 0;

  // ランキングデータ (仮の初期表示用など)
  let topScores = [0, 0, 0];

  function resize() {
    const w = window.innerWidth;
    const h = window.innerHeight;
    canvas.width = w;
    canvas.height = h;

    scaleRatio = h / baseHeight;
    player.groundY = h - (isPC ? 120 : 100);

    if (gameState === STATE_START) {
      player.y = player.groundY - player.height;
    }
  }
  window.addEventListener('resize', resize);
  resize();

  // イベントリスナー
  function handleInput(e) {
    if (e.type === 'touchstart') e.preventDefault();

    if (gameState === STATE_START) {
      soundBgm.play().catch(()=>{});
      gameState = STATE_PLAYING;
      resetGame();
      jump();
    } else if (gameState === STATE_PLAYING) {
      jump();
    } else if (gameState === STATE_GAMEOVER_ANIM) {
      // アニメーションをスキップして即座に最終スコア表示＆メニューへ
      if (countUpTimer) clearInterval(countUpTimer);
      displayCount = actualRamenCount;
      updateTopScores(actualRamenCount);
      gameState = STATE_GAMEOVER_MENU;
      menuOverlay.style.display = 'flex';
    }
  }

  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space') handleInput(e);
  });
  window.addEventListener('touchstart', handleInput, { passive: false });
  window.addEventListener('mousedown', handleInput);

  retryBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    menuOverlay.style.display = 'none';
    soundBgm.play().catch(()=>{});
    gameState = STATE_PLAYING;
    resetGame();
  });

  function jump() {
    if (player.isGrounded) {
      player.vy = player.jumpPower;
      player.isGrounded = false;
    }
  }

  function resetGame() {
    obstacles = [];
    spawnTimer = 0;
    actualRamenCount = 0;
    displayCount = 0;
    speedLoopTimer = 0;
    currentBaseSpeed = isPC ? 8 : 6;
    player.gravity = isPC ? 0.9 : 0.75;
    player.jumpPower = isPC ? -17 : -15;
    player.y = player.groundY - player.height;
    player.vy = 0;
    player.isGrounded = true;
  }

  function updateTopScores(newScore) {
    let scores = JSON.parse(localStorage.getItem('ramen_top_scores') || '[0, 0, 0]');
    scores.push(newScore);
    scores.sort((a, b) => b - a);
    topScores = scores.slice(0, 3);
    localStorage.setItem('ramen_top_scores', JSON.stringify(topScores));
  }

  // 初期化時にハイスコア読み込み
  topScores = JSON.parse(localStorage.getItem('ramen_top_scores') || '[0, 0, 0]');

  function startGameOverAnim() {
    gameState = STATE_GAMEOVER_ANIM;
    soundBgm.pause();
    soundBgm.currentTime = 0;
    
    soundJap.currentTime = 0;
    soundJap.play().catch(()=>{});

    displayCount = 0;
    scoreTextTimer = 0;

    let duration = 2000; // 2秒かけてカウントアップ
    let steps = Math.max(actualRamenCount, 1);
    let intervalTime = Math.max(duration / steps, 30);

    countUpTimer = setInterval(() => {
      if (displayCount < actualRamenCount) {
        displayCount++;
      } else {
        clearInterval(countUpTimer);
        updateTopScores(actualRamenCount);
        gameState = STATE_GAMEOVER_MENU;
        menuOverlay.style.display = 'flex';
      }
    }, intervalTime);
  }

  function update() {
    if (gameState === STATE_PLAYING) {
      // スピードの加減速ループ処理 (正弦波でなめらかに変化)
      speedLoopTimer += 0.01;
      const speedVariation = Math.cos(speedLoopTimer) * 2; 
      currentBaseSpeed = (isPC ? 8 : 6) + speedVariation;
      
      // スピードに合わせて重力調整
      player.gravity = (isPC ? 0.9 : 0.75) * (currentBaseSpeed / (isPC ? 8 : 6));

      // 背景のスクロール
      bgX -= currentBaseSpeed * 0.5;

      // プレイヤーの物理挙動
      player.vy += player.gravity;
      player.y += player.vy;

      if (player.y >= player.groundY - player.height) {
        player.y = player.groundY - player.height;
        player.vy = 0;
        player.isGrounded = true;
      }

      // 障害物の生成
      spawnTimer++;
      if (spawnTimer > 90) {
        if (Math.random() < 0.6) {
          const obsSize = isPC ? 60 : 50;
          obstacles.push({
            x: canvas.width + 50,
            y: player.groundY - obsSize,
            width: obsSize,
            height: obsSize,
            passed: false
          });
        }
        spawnTimer = 0;
      }

      // 障害物の移動と当たり判定
      for (let i = obstacles.length - 1; i >= 0; i--) {
        let obs = obstacles[i];
        obs.x -= currentBaseSpeed;

        // スコア加算
        if (!obs.passed && obs.x + obs.width < player.x) {
          obs.passed = true;
          actualRamenCount++;
        }

        // 当たり判定 (矩形衝突判定)
        const hitMargin = 10;
        if (
          player.x + hitMargin < obs.x + obs.width - hitMargin &&
          player.x + player.width - hitMargin > obs.x + hitMargin &&
          player.y + hitMargin < obs.y + obs.height - hitMargin &&
          player.y + player.height - hitMargin > obs.y + hitMargin
        ) {
          startGameOverAnim();
          break;
        }

        // 画面外に出たら削除
        if (obs.x + obs.width < -100) {
          obstacles.splice(i, 1);
        }
      }
    }
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 1. 背景描画 (4種類の画像を時間ループで切り替え)
    if (bgReadyCount > 0) {
      const activeImages = bgImages.filter(img => img.complete);
      if (activeImages.length > 0) {
        const bgIndex = Math.floor(Math.abs(bgX) / 2000) % activeImages.length;
        const currentBg = activeImages[bgIndex];

        let renderBgX = bgX % canvas.width;
        ctx.drawImage(currentBg, renderBgX, 0, canvas.width, canvas.height);
        ctx.drawImage(currentBg, renderBgX + canvas.width, 0, canvas.width, canvas.height);
      }
    }

    // 2. 地面（デバッグ・補強用ライン）
    ctx.fillStyle = '#444';
    ctx.fillRect(0, player.groundY, canvas.width, canvas.height - player.groundY);

    // 3. 障害物の描画
    obstacles.forEach(obs => {
      if (obstacleImg.complete) {
        ctx.drawImage(obstacleImg, obs.x, obs.y, obs.width, obs.height);
      } else {
        ctx.fillStyle = 'red';
        ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
      }
    });

    // 4. プレイヤーの描画
    if (playerImg.complete) {
      ctx.drawImage(playerImg, player.x, player.y, player.width, player.height);
    } else {
      ctx.fillStyle = 'yellow';
      ctx.fillRect(player.x, player.y, player.width, player.height);
    }

    // 5. UIテキスト描画
    if (gameState === STATE_START) {
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#fff';
      ctx.font = 'bold 36px serif';
      ctx.textAlign = 'center';
      ctx.fillText('走れ！ラーメン娘！！', canvas.width / 2, canvas.height / 2 - 40);

      ctx.font = '20px serif';
      ctx.fillText('タップまたはスペースキーでジャンプ！', canvas.width / 2, canvas.height / 2 + 20);
    } else if (gameState === STATE_PLAYING) {
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 28px serif';
      ctx.textAlign = 'left';
      ctx.fillText(`完食: ${actualRamenCount} 杯`, 20, 50);
    } else if (gameState === STATE_GAMEOVER_ANIM || gameState === STATE_GAMEOVER_MENU) {
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#ff4b2b';
      ctx.font = 'bold 40px serif';
      ctx.textAlign = 'center';
      ctx.fillText('GAMEOVER', canvas.width / 2, canvas.height / 2 - 100);

      ctx.fillStyle = '#fff';
      ctx.font = 'bold 32px serif';
      ctx.fillText(`完食: ${displayCount} 杯！`, canvas.width / 2, canvas.height / 2 - 40);

      // ランキング表示
      if (gameState === STATE_GAMEOVER_MENU) {
        ctx.font = '20px serif';
        ctx.fillStyle = '#ffd700';
        ctx.fillText('--- 社内TOP3記録 ---', canvas.width / 2, canvas.height / 2 + 10);
        
        topScores.forEach((score, idx) => {
          ctx.fillStyle = '#fff';
          ctx.fillText(`${idx + 1}位: ${score} 杯`, canvas.width / 2, canvas.height / 2 + 40 + (idx * 25));
        });
      }
    }
  }

  function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
  }

  loop();
</script>

</body>
</html>

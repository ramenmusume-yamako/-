<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ミニゲーム - HARDモード</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a2e;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            display: block;
            text-align: center;
        }
        #game-container {
            position: relative;
            width: 800px;
            height: 500px;
            margin: 30px auto;
            background: #000;
            overflow: hidden;
            border: 4px solid #f1c40f;
            border-radius: 8px;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #ui {
            position: absolute;
            top: 15px;
            left: 15px;
            color: #ffffff;
            font-size: 16px;
            font-weight: bold;
            text-align: left;
            line-height: 1.5;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            z-index: 10;
        }
        /* メニューオーバーレイ */
        #game-menu-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            display: none; /* ゲーム終了時に flex / block に切り替え */
            justify-content: center;
            align-items: center;
            z-index: 20;
        }
        .menu-wrapper {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 500px;
            background: rgba(20, 20, 30, 0.95);
            border: 3px solid #f1c40f;
            border-radius: 12px;
            padding: 25px;
            color: white;
        }
        .menu-title {
            font-size: 28px;
            color: #ff4757;
            margin-bottom: 10px;
            font-weight: bold;
            letter-spacing: 2px;
        }
        .result-info {
            font-size: 18px;
            margin-bottom: 20px;
            color: #f1c40f;
        }
        .menu-btn-group {
            display: block;
        }
        .custom-menu-btn {
            display: block;
            width: 260px;
            margin: 12px auto;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            border: 2px solid #ffffff;
            background: #2f3542;
            cursor: pointer;
            transition: all 0.2s;
        }
        .custom-menu-btn:hover {
            background: #57606f;
            transform: scale(1.03);
        }
        .custom-menu-btn.primary {
            background: #ff4757;
            border-color: #ff6b81;
        }
        .custom-menu-btn.primary:hover {
            background: #ff6b81;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="ui">BEST: <span id="best-score">0</span>秒<br>SCORE: <span id="current-score">0</span>秒</div>
        
        <canvas id="gameCanvas" width="800" height="500"></canvas>

        <div id="game-menu-overlay">
            <div class="menu-wrapper">
                <div class="menu-title">完食 / GAME OVER</div>
                <div class="result-info">
                    記録: <span id="final-score">0</span> 秒<br>
                    最高記録: <span id="menu-best-score">0</span> 秒
                </div>
                <div class="menu-btn-group">
                    <button class="custom-menu-btn primary" id="btn-retry">もう一度（リトライ）</button>
                    <a href="easy.html" class="custom-menu-btn">EASY モードで遊ぶ</a>
                    <a href="nomal.html" class="custom-menu-btn">NORMAL モードで遊ぶ</a>
                    <a href="index.html" class="custom-menu-btn">ホームページに戻る</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const menuOverlay = document.getElementById('game-menu-overlay');
        
        // UI要素
        const currentScoreEl = document.getElementById('current-score');
        const bestScoreEl = document.getElementById('best-score');
        const finalScoreEl = document.getElementById('final-score');
        const menuBestScoreEl = document.getElementById('menu-best-score');
        const btnRetry = document.getElementById('btn-retry');

        // ゲーム状態
        let gameOver = false;
        let score = 0;
        let startTime = Date.now();
        let bestScore = localStorage.getItem('bestScore_hard') || 0;
        bestScoreEl.textContent = bestScore;

        // -----------------------------------------------------------
        // 🛠 セキュリティ(CORS)によるフリーズ対策：画像のロード待ちをしない
        // -----------------------------------------------------------
        const pImgL = new Image(); 
        const pImgR = new Image();
        pImgL.src = 'meanal.png';
        pImgR.src = 'meanar.png';

        const bgImages = [];
        const bgSrcs = ['bg1.jpg', 'bg2.jpg', 'bg3.jpg'];
        let bgScroll = 0;

        bgSrcs.forEach((src, index) => {
            bgImages[index] = new Image();
            bgImages[index].src = src;
        });

        // プレイヤーデータ
        const player = {
            x: 100,
            y: 350,
            width: 60,
            height: 70,
            speed: 7,
            direction: 'right'
        };

        // 障害物データ (HARDモード用に高速・高密度化)
        const obstacles = [];
        const spawnInterval = 40; // 出現頻度を短く
        let frameCount = 0;

        // キー入力状態
        const keys = {};
        window.addEventListener('keydown', e => { keys[e.key] = true; });
        window.addEventListener('keyup', e => { keys[e.key] = false; });

        // 障害物の生成
        function spawnObstacle() {
            const size = Math.random() * 30 + 20;
            obstacles.push({
                x: canvas.width,
                y: Math.random() * (canvas.height - 150) + 50,
                width: size,
                height: size,
                speed: Math.random() * 5 + 6 // スピードアップ
            });
        }

        // 当たり判定
        function checkCollision(rect1, rect2) {
            return rect1.x < rect2.x + rect2.width &&
                   rect1.x + rect1.width > rect2.x &&
                   rect1.y < rect2.y + rect2.height &&
                   rect1.y + rect1.height > rect2.y;
        }

        // ゲームメインループ
        function update() {
            if (gameOver) return;

            frameCount++;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. 背景スクロール描画
            bgScroll -= 2;
            if (bgScroll <= -canvas.width) bgScroll = 0;
            
            if (bgImages[0] && bgImages[0].complete) {
                ctx.drawImage(bgImages[0], bgScroll, 0, canvas.width, canvas.height);
                ctx.drawImage(bgImages[0], bgScroll + canvas.width, 0, canvas.width, canvas.height);
            } else {
                // 画像が読み込めない場合は暗い背景色にする
                ctx.fillStyle = '#1e272e';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            // 2. プレイヤー移動処理
            if (keys['ArrowLeft'] || keys['a']) {
                player.x -= player.speed;
                player.direction = 'left';
            }
            if (keys['ArrowRight'] || keys['d']) {
                player.x += player.speed;
                player.direction = 'right';
            }
            if (keys['ArrowUp'] || keys['w']) {
                player.y -= player.speed;
            }
            if (keys['ArrowDown'] || keys['s']) {
                player.y += player.speed;
            }

            // 画面外はみ出し判定
            if (player.x < 0) player.x = 0;
            if (player.x > canvas.width - player.width) player.x = canvas.width - player.width;
            if (player.y < 0) player.y = 0;
            if (player.y > canvas.height - player.height) player.y = canvas.height - player.height;

            // 3. プレイヤーキャラクター描画
            const activeImg = player.direction === 'left' ? pImgL : pImgR;
            if (activeImg && activeImg.complete) {
                ctx.drawImage(activeImg, player.x, player.y, player.width, player.height);
            } else {
                // 画像ブロック時は代わりに黄色のボックスを表示してゲームを続行
                ctx.fillStyle = '#f1c40f';
                ctx.fillRect(player.x, player.y, player.width, player.height);
            }

            // 4. 障害物の処理
            if (frameCount % spawnInterval === 0) {
                spawnObstacle();
            }

            for (let i = obstacles.length - 1; i >= 0; i--) {
                const obs = obstacles[i];
                obs.x -= obs.speed;

                // 障害物の描画 (赤色の四角形)
                ctx.fillStyle = '#ff4757';
                ctx.fillRect(obs.x, obs.y, obs.width, obs.height);

                // 衝突チェック
                if (checkCollision(player, obs)) {
                    endGame();
                }

                // 画面外スイープ
                if (obs.x + obs.width < 0) {
                    obstacles.splice(i, 1);
                }
            }

            // 5. スコア（生存時間）の加算
            score = Math.floor((Date.now() - startTime) / 1000);
            currentScoreEl.textContent = score;

            requestAnimationFrame(update);
        }

        // ゲームオーバー処理
        function endGame() {
            gameOver = true;
            
            if (score > bestScore) {
                bestScore = score;
                localStorage.setItem('bestScore_hard', bestScore);
            }

            finalScoreEl.textContent = score;
            menuBestScoreEl.textContent = bestScore;
            bestScoreEl.textContent = bestScore;
            
            // メニューポップアップを表示
            menuOverlay.style.display = 'flex';
        }

        // リトライ処理
        btnRetry.addEventListener('click', () => {
            gameOver = false;
            score = 0;
            obstacles.length = 0;
            frameCount = 0;
            player.x = 100;
            player.y = 350;
            player.direction = 'right';
            startTime = Date.now();
            menuOverlay.style.display = 'none';
            update();
        });

        // ゲーム起動
        update();
    </script>
</body>
</html>
